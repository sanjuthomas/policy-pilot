<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Governed Activity Evidence</title>
    <link rel="stylesheet" href="/static/styles.css?v=6" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="brand-mark"></span><div><h1>Governed Activity Evidence</h1><p id="subtitle" class="subtitle mono">Loading…</p></div></div>
      <div class="auth">
        <span id="auth-status" class="muted"></span>
        <input id="auth-user" value="audit-001" aria-label="User ID" />
        <input id="auth-password" type="password" placeholder="Password" aria-label="Password" />
        <button id="auth-login">Sign in</button><button id="auth-logout" class="hidden">Sign out</button>
        <a href="/">← Console</a>
      </div>
    </header>
    <main class="detail">
      <div id="summary"></div>
      <section class="card">
        <div class="card-header"><h2>OPA result</h2><button id="load-opa">Load linked evidence</button></div>
        <p id="opa-source" class="muted">OPA is not duplicated here; linked security-event evidence loads on demand.</p>
        <div id="opa-panel" class="columns hidden">
          <div><h3>Evaluate request</h3><pre id="opa-request"></pre></div>
          <div><h3>Evaluate response</h3><pre id="opa-response"></pre></div>
        </div>
        <details id="event-details" class="hidden"><summary>Full linked security event</summary><pre id="event-json"></pre></details>
      </section>
      <section class="card"><div class="card-header"><h2>Full audit record</h2></div><pre id="json"></pre></section>
    </main>
    <script src="/static/auth.js?v=2"></script>
    <script src="/static/format.js?v=1"></script>
    <script src="/static/audit.js?v=3"></script>
  </body>
</html>
