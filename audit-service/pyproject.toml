[project]
name = "audit-service"
version = "0.1.0"
description = "Centralized technology-auditor console for security events and governed activity"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "motor>=3.6.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "aiofiles>=24.1.0",
    "platform-auth",
    "ssi-telemetry",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audit_console"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "../shared/platform_auth/src"]

[tool.coverage.run]
source = ["audit_console"]
omit = ["src/audit_console/main.py"]

[tool.coverage.report]
fail_under = 80
